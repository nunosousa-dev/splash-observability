# Run `make notify` on the Mac for critical desktop notifications. Alertmanager
# reaches the host listener over Docker Desktop's host.docker.internal gateway.
# No credentials or external notification service are required.
global:
  resolve_timeout: 5m

route:
  receiver: desktop
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    # Non-critical alerts remain visible in Alertmanager but do not notify.
    - matchers:
        - 'severity!="critical"'
      receiver: quiet

receivers:
  - name: desktop
    webhook_configs:
      - url: http://host.docker.internal:9393/alert
        send_resolved: true
  - name: quiet

# To use Slack or email instead, add the appropriate receiver here and change the
# route's receiver. Keep credentials outside version control (e.g. api_url_file).

# Prometheus config for the Splash observability stack.
#
# The proxy container is the single scrape target: it relays Splash's own runtime
# metrics (/metrics/splash) and publishes request-level metrics (/metrics).
#
# Scrape jobs require `job_name` and `static_configs`; bare `name`/`targets`
# are not valid Prometheus scrape configuration keys.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/splash-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Splash's own runtime metrics (scheduler, KV cache, throughput, memory, thermal)
  - job_name: splash-runtime
    scrape_interval: 10s
    metrics_path: /metrics/splash
    static_configs:
      - targets:
          - proxy:8101
    relabel_configs:
      - target_label: component
        replacement: inference-engine

  # Request-level metrics produced by the observability proxy
  - job_name: splash-proxy
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - proxy:8101
    relabel_configs:
      - target_label: component
        replacement: obs-proxy

  - job_name: prometheus-self
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
